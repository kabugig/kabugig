<style>
:root{
  --serif:Cambria,"Bitstream Charter","Charis SIL",Georgia,"Times New Roman",serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
}
:root,[data-theme="dark"]{
  --bg:#0A1733;--ink:#FFFFFF;--ink-soft:rgba(255,255,255,.76);--ink-mute:rgba(255,255,255,.54);
  --rule:rgba(255,255,255,.14);--rule-strong:rgba(255,255,255,.28);
  --surface:rgba(255,255,255,.05);
  --grid:rgba(255,255,255,.045);--mast-bg:rgba(10,23,51,.86);
  --orange:#F97316;--orange-hi:#EA630B;--accent-ink:#F97316;--btn-shadow:rgba(249,115,22,.32);
  --hero-tint:rgba(249,115,22,.16);--hero-a:#0A1733;--hero-b:#14286B;--hero-c:#1E42B8;
  --shadow:0 24px 60px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#F4F6FB;--ink:#0A1733;--ink-soft:rgba(10,23,51,.80);--ink-mute:rgba(10,23,51,.64);
  --rule:rgba(10,23,51,.14);--rule-strong:rgba(10,23,51,.26);
  --surface:rgba(30,66,184,.08);
  --grid:rgba(10,23,51,.032);--mast-bg:rgba(244,246,251,.88);
  --orange:#C74905;--orange-hi:#B03D06;--accent-ink:#B8410A;--btn-shadow:rgba(199,73,5,.26);
  --hero-tint:rgba(249,115,22,.07);--hero-a:#FFFFFF;--hero-b:#E7EDFB;--hero-c:#D3DEF8;
  --shadow:0 24px 60px rgba(10,23,51,.16);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font-family:var(--serif);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .28s ease,color .28s ease}
a{color:inherit}

.masthead{border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--mast-bg);backdrop-filter:blur(10px);z-index:30}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:62px;max-width:1060px;margin:0 auto;padding:0 28px}
.mark{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.mark span{color:var(--accent-ink)}
.navlinks{display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.navlinks a{color:var(--ink-mute);text-decoration:none}
.navlinks a:hover,.navlinks a:focus-visible{color:var(--ink)}
.themetoggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--rule);border-radius:50%;background:var(--surface);color:var(--ink-soft);cursor:pointer}
.themetoggle:hover,.themetoggle:focus-visible{color:var(--accent-ink);border-color:var(--accent-ink)}
.themetoggle svg{width:17px;height:17px;display:block}
.themetoggle .i-moon{display:none}
[data-theme="light"] .themetoggle .i-sun{display:none}
[data-theme="light"] .themetoggle .i-moon{display:block}
@media(max-width:480px){.masthead .wrap{padding:0 16px}.mark{font-size:clamp(9.5px,3vw,12.5px);letter-spacing:.08em}}

main{
  position:relative;overflow:hidden;min-height:calc(100vh - 62px);
  padding:56px 20px 64px;text-align:center;
  background:radial-gradient(1000px 500px at 78% 10%,var(--hero-tint),transparent 62%),
             linear-gradient(128deg,var(--hero-a) 0%,var(--hero-b) 46%,var(--hero-c) 100%);
}
main::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:66px 66px}
.inner{position:relative;z-index:2;max-width:520px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
.kicker em{font-style:normal;color:var(--accent-ink);border-bottom:2px solid var(--orange)}
h1{font-weight:700;font-size:clamp(2.1rem,7vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 12px}
h1 em{font-style:italic;color:var(--orange)}
.sub{color:var(--ink-soft);margin:0 auto 34px;max-width:36ch}

.qrwrap{position:relative;display:inline-block;padding:18px}
.qrwrap i{position:absolute;width:26px;height:26px;border:2px solid var(--orange)}
.qrwrap i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:6px}
.qrwrap i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:6px}
.qrwrap i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:6px}
.qrwrap i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:6px}
.qr{display:block;width:min(280px,64vw);height:auto;background:#FFFFFF;padding:16px;border-radius:20px;box-shadow:var(--shadow)}
.urlpill{display:inline-flex;align-items:center;margin-top:20px;padding:10px 20px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--surface);font-family:var(--mono);font-size:13px;text-decoration:none}
.urlpill:hover,.urlpill:focus-visible{border-color:var(--orange)}
.loc{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);margin:18px 0 0}

.card{margin:56px auto 0;padding:30px 26px 26px;border:1px solid var(--rule-strong);border-radius:24px;background:var(--surface);backdrop-filter:blur(8px);text-align:center}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--orange);margin:0 auto 14px;display:block}
.card h2{font-size:1.5rem;margin:0 0 2px;letter-spacing:-.01em}
.card .role{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 12px}
.card .blurb{color:var(--ink-soft);font-size:1rem;margin:0 0 22px}
.save{display:block;width:100%;padding:14px 20px;border-radius:999px;background:var(--orange);color:#fff;text-decoration:none;font-size:1.02rem;font-weight:700;box-shadow:0 8px 26px var(--btn-shadow);margin-bottom:14px}
.save:hover,.save:focus-visible{background:var(--orange-hi)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;border:1px solid var(--rule-strong);border-radius:14px;background:var(--surface);text-decoration:none;font-family:var(--mono);font-size:12.5px;letter-spacing:.04em}
.actions a:hover,.actions a:focus-visible{background:var(--orange);border-color:var(--orange);color:#fff}
.actions svg{width:17px;height:17px;flex:0 0 auto}
.more{margin-top:20px;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.more a{color:var(--accent-ink);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
